<head>

<title>Fernando Conde Jackson · SAFER Sostenibilidad</title>

<style>
  :root {
    --ink:  #0F1419;
    --blue: #5BA3D0;
    --off:  #FAFAF7;
    --gray: #888780;
    --lg:   #D3D1C7;
    --wh:   #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Inter', sans-serif;
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0;
  }
  .card {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--wh);
  }

  /* ── Hero ── */
  .hero {
    background: var(--blue);
    padding: 48px 32px 36px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .hero-logo { position: relative; margin-bottom: 32px; }
  .hero-name {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic; font-size: 34px;
    color: var(--wh); letter-spacing: -0.5px;
    line-height: 1.05; position: relative; margin-bottom: 6px;
  }
  .hero-role {
    font-family: 'Inter', sans-serif;
    font-size: 10px; font-weight: 500;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.58); position: relative;
  }

  /* ── Body ── */
  .body {
    flex: 1;
    padding: 32px 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Contact list */
  .contact-list { display: flex; flex-direction: column; }
  .contact-link {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 0;
    border-bottom: 0.5px solid var(--lg);
    text-decoration: none;
    transition: opacity .15s;
  }
  .contact-link:first-child { padding-top: 0; }
  .contact-link:last-child { border-bottom: none; padding-bottom: 0; }
  .contact-link:active { opacity: 0.6; }
  .icon-wrap {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(91,163,208,0.10);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap svg { width: 15px; height: 15px; }
  .contact-info { flex: 1; }
  .contact-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--gray);
    display: block; margin-bottom: 2px;
  }
  .contact-val {
    font-size: 14px; color: var(--ink);
    font-weight: 400; line-height: 1.3;
  }
  .contact-arrow { color: var(--lg); font-size: 18px; line-height: 1; }

  /* Save button */
  .save-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    background: var(--blue); color: var(--wh);
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 0.3px;
    padding: 18px 24px; text-decoration: none;
    border-radius: 2px; transition: opacity .15s;
  }
  .save-btn:active { opacity: 0.8; }
  .save-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ── QR doble ── */
  .qr-double {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .qr-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px 12px;
    background: var(--off);
    border: 0.5px solid var(--lg);
  }
  /* QR de vídeo: mismo fondo que contacto */
  .qr-block.video {
    background: var(--off);
    border-color: var(--lg);
  }
  .qr-wrap {
    width: 88px; height: 88px;
    border: 0.5px solid var(--lg);
    padding: 4px;
    background: var(--wh);
    flex-shrink: 0;
  }
  .qr-block.video .qr-wrap {
    border-color: var(--lg);
  }
  .qr-wrap img { width: 100%; height: 100%; display: block; }
  .qr-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500;
    text-align: center; line-height: 1.5;
  }
  .qr-block .qr-label { color: var(--blue); }
  .qr-block.video .qr-label { color: var(--blue); }

  /* separador decorativo entre QRs */
  .qr-divider {
    display: flex; align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px; color: var(--lg);
    letter-spacing: 1px;
    flex-shrink: 0;
    align-self: center;
  }

  /* Footer */
  .footer {
    background: var(--ink);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .footer-logo {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic; font-size: 17px;
    color: rgba(250,250,247,0.55);
    display: flex; align-items: flex-start; gap: 4px;
  }
  .footer-dot {
    width: 4px; height: 4px; background: var(--blue);
    border-radius: 50%; margin-top: 4px; flex-shrink: 0;
  }
  .footer-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px; color: rgba(250,250,247,0.22);
    text-align: right; line-height: 1.7; letter-spacing: 0.5px;
  }
</style>
</head>
